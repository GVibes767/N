name: ZP encrypted review export
on:
  push:
    paths: ['.github/workflows/zp-encrypted-review-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          REQUEST_IDS: 'gvm-zp-062d8aa6b00d441da8ef13985886bfdb'
        run: |
          python - <<'PY'
          import os,pathlib,urllib.request,json,re,time
          out=pathlib.Path('encrypted-receipts');out.mkdir()
          for rid in os.environ['REQUEST_IDS'].split():
              assert re.fullmatch(r'gvm-zp-[a-f0-9]{32}',rid)
              url='https://raw.githubusercontent.com/mediagvibes-wq/gvm-relay/main/relay/responses/'+rid+'.json'
              for a in range(12):
                  try:
                      data=urllib.request.urlopen(url,timeout=20).read();break
                  except Exception:
                      if a==11:raise
                      time.sleep(5)
              obj=json.loads(data)
              assert obj['requestId']==rid and obj['target']=='ChatGPT' and 'ciphertext' in obj
              (out/(rid+'.json')).write_bytes(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zp-encrypted-receipts
          path: encrypted-receipts/*.json
          retention-days: 1
          if-no-files-found: error
